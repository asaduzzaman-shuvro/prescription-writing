# Local dev infrastructure.
#   docker compose -f infra/docker-compose.yml up -d
# First run only: psql postgres://rx:rx@localhost:5433/rx -f infra/powersync/setup.sql, then pnpm db:migrate.
name: rx
services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: rx
      POSTGRES_PASSWORD: rx
      POSTGRES_DB: rx
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rx -d rx"]
      interval: 5s
      timeout: 5s
      retries: 20

  powersync:
    image: journeyapps/powersync-service:1.26.1
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: "8080"
      PS_DATA_SOURCE_URI: postgresql://powersync_role:powersync_dev@postgres:5432/rx
      PS_STORAGE_SOURCE_URI: postgresql://powersync_storage_user:storage_dev@postgres:5432/powersync_storage
      PS_JWT_SECRET: ${PS_JWT_SECRET}
      PS_JWT_KID: ${PS_JWT_KID:-powersync-dev}
    volumes:
      - ./powersync/service.yaml:/config/service.yaml:ro
      - ./powersync/sync-config.yaml:/config/sync-config.yaml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  pgdata:

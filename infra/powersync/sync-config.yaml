# Sync Streams: what each signed-in user downloads into the browser's local SQLite.
# Keep in sync with apps/web/src/lib/powersync/schema.ts and the `powersync` publication.
#
# Priorities (0=highest … 3=lowest): clinic data first so Today/Patients open quickly;
# the ~22k-row medicine catalogue continues in the background.
config:
  edition: 3
streams:
  # Global, read-only catalogue (~22k products). Inactive rows drop out and are removed on clients.
  catalogue:
    auto_subscribe: true
    priority: 3
    queries:
      - SELECT id, brand_name, form_id, company_id, strength_text, generic_text, medicine_system FROM brand_product WHERE is_active = true
      - SELECT id, name, short_label, default_route, default_unit FROM dosage_form
      - SELECT id, name FROM company
      - SELECT id, name, is_antibiotic, aware_group, pregnancy_category, paed_max_mg_per_kg_day, adult_max_mg_per_day FROM generic WHERE is_active = true
      - SELECT product_id || ':' || position AS id, product_id, position, generic_id, strength_value, strength_unit, basis FROM product_ingredient
      - SELECT id, generic_a, generic_b, severity, effect, management FROM generic_interaction WHERE is_active = true
  libraries:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT code AS id, name, name_bn FROM specialty
      - SELECT id, specialty_code, sort_order, name, name_bn FROM complaint WHERE is_active = true
      - SELECT id, specialty_code, sort_order, name, category FROM history_item WHERE is_active = true
      - SELECT id, specialty_code, sort_order, name, category FROM investigation WHERE is_active = true
      - SELECT id, specialty_code, sort_order, name, icd10, icd11 FROM diagnosis WHERE is_active = true
      - SELECT id, specialty_code, sort_order, text_bn, text_en, category FROM advice_snippet WHERE is_active = true
      - SELECT id, specialty_code, sort_order, text_bn, text_en FROM instruction_snippet WHERE is_active = true
      - SELECT id, specialty_code, name, version, schema FROM specialty_template WHERE is_active = true
      # The platform's lab catalogue; each clinic's own rows come with tenant_data.
      - SELECT * FROM lab_test WHERE tenant_id IS NULL AND is_active = true
      - SELECT * FROM lab_panel WHERE tenant_id IS NULL AND is_active = true
  shared_templates:
    auto_subscribe: true
    priority: 2
    queries:
      - SELECT * FROM rx_template WHERE tenant_id IS NULL AND is_active = true
  # Note: PowerSync sync rules only allow auth.parameter() with `=` against row columns (not `>=`),
  # so history limiting uses client prune via POWERSYNC_SYNC_DAYS (see apps/web sync connector).
  tenant_data:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM patient WHERE tenant_id = auth.parameter('tenant_id') AND deleted_at IS NULL
      - SELECT * FROM encounter WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM prescription WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM lab_report WHERE tenant_id = auth.parameter('tenant_id') AND deleted_at IS NULL
      # No is_active filter: a clinic hides a test with an inactive row, which devices must receive.
      - SELECT * FROM lab_test WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM lab_panel WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM lab_profile WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM chamber WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT user_id AS id, tenant_id, name_en, name_bn, degrees_en, degrees_bn, designation, institution, specialty_code, specialty_label, bmdc_number, bmdc_expiry, bmdc_verified_at, signature_data_url FROM doctor_profile WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM rx_template WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM appointment WHERE tenant_id = auth.parameter('tenant_id')
  user_data:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM doctor_favorite WHERE user_id = auth.user_id()
      - SELECT * FROM custom_medicine WHERE owner_user_id = auth.user_id()
      - SELECT * FROM doctor_complaint WHERE owner_user_id = auth.user_id()
